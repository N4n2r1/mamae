<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Melhor Mãe do Mundo</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <h1 id="frase">Carregando memórias...</h1>
        
        <div class="image-container">
            <img id="imagem" src="" alt="Nossa memória" onclick="proximafoto()">
        </div>

        <div class="controls">
            <button onclick="proximafoto()">Próxima Memória ❤️</button>
        </div>
        <p class="counter"><span id="numero-atual">1</span> / <span id="total-fotos">0</span></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
